<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中職九宮格</title>
<style>
  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --ink: #1c1b19;
    --ink-2: #5d5a54;
    --ink-3: #8f8b83;
    --line: #e2ded6;
    --accent: #1f4fd1;
    --accent-ink: #ffffff;
    --accent-soft: #e4ebfc;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }

  /* ---------- 首頁 ---------- */
  .home { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 48px 0; }
  .home .eyebrow { font-size: 14px; color: var(--ink-2); letter-spacing: .08em; margin: 0 0 8px; }
  .home h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.2; margin: 0 0 12px; }
  .home .lead { color: var(--ink-2); margin: 0 0 32px; max-width: 34em; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .mode {
    text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  .mode:hover { transform: translateY(-2px); border-color: var(--accent); }
  .mode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .mode strong { display: block; font-size: 24px; margin-bottom: 4px; }
  .mode span { color: var(--ink-2); font-size: 14px; }
  .home .note { margin-top: 24px; font-size: 13px; color: var(--ink-3); }

  /* ---------- 進度列 ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar .wrap { padding-top: 10px; padding-bottom: 10px; }
  .toprow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .phase { font-weight: 700; font-size: 15px; }
  .phase .sep { color: var(--ink-3); font-weight: 400; margin: 0 4px; }
  .phase .count { font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .navbtns { display: flex; gap: 4px; }
  .ghost {
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
    font-size: 13px; color: var(--ink-2); cursor: pointer;
  }
  .ghost:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
  .ghost:disabled { opacity: .4; cursor: default; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
  .stages { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
  .stages .on { color: var(--accent); font-weight: 700; }
  .stages .done { color: var(--ink-2); }

  /* ---------- 選擇畫面 ---------- */
  .pick { padding-top: 16px; padding-bottom: 96px; }
  .prompt { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .prompt h2 { font-size: 18px; margin: 0; }
  .prompt .hint { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prompt .hint.flash { animation: flash .5s; }
  @keyframes flash { 30% { color: #c0392b; } }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cards.few { grid-template-columns: repeat(var(--n), minmax(0, 200px)); justify-content: center; gap: 12px; }
  @media (min-width: 760px) {
    .cards { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  }

  .card {
    position: relative; display: flex; flex-direction: column; text-align: left; padding: 0;
    background: var(--surface); border: 2px solid transparent; border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-1px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .band {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    background: var(--team); color: var(--team-ink); padding: 4px 8px; font-size: 11px; font-weight: 700;
    min-height: 24px;
  }
  .tag { font-weight: 400; background: rgba(255,255,255,.25); border-radius: 4px; padding: 0 5px; }
  .tag.dark { background: rgba(0,0,0,.12); }
  .name {
    font-size: 17px; font-weight: 700; padding: 8px 8px 6px; line-height: 1.25;
    border-left: 4px solid var(--team); margin: 6px 0 0; word-break: break-all;
  }
  .name.long { font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 2px; padding: 4px 8px 8px; margin: 0; }
  .stats div { min-width: 0; }
  .stats dt { font-size: 10px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats dd { margin: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .check {
    position: absolute; top: 30px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700;
    display: grid; place-items: center; transform: scale(0); transition: transform .15s;
  }
  .card.sel .check { transform: scale(1); }

  @media (max-width: 420px) {
    .name { font-size: 15px; padding: 6px 6px 4px; }
    .name.long { font-size: 12px; }
    .stats { grid-template-columns: repeat(var(--cols), auto); justify-content: space-between; gap: 4px; padding: 2px 6px 6px; }
    .stats dt { font-size: 9px; overflow: visible; }
    .stats dd { font-size: 12px; }
    .band { padding: 3px 6px; font-size: 10px; }
  }

  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: linear-gradient(to top, var(--bg) 70%, rgba(244,242,238,0));
    padding: 16px 0 calc(12px + env(safe-area-inset-bottom));
  }
  .actionbar .wrap { display: flex; justify-content: center; }
  .primary {
    width: 100%; max-width: 360px; padding: 14px 20px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .primary:disabled { background: #b9b5ad; cursor: default; }
  .primary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* ---------- 結果頁 ---------- */
  .result { padding-top: 24px; padding-bottom: 48px; max-width: 592px; }
  .result h2 { font-size: 24px; margin: 0 0 4px; }
  .result .sub { color: var(--ink-2); margin: 0 0 20px; font-size: 14px; }
  .grid9 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 560px; }
  .cell {
    position: relative; aspect-ratio: 1; border-radius: var(--radius); background: var(--team); color: var(--team-ink);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; overflow: hidden; box-shadow: var(--shadow);
  }
  .cell .rank { position: absolute; top: 8px; left: 10px; font-size: 13px; font-weight: 700; opacity: .85; }
  .cell .rank.top { font-size: 22px; opacity: 1; }
  .cell .cname { font-size: clamp(15px, 4.6vw, 22px); font-weight: 800; line-height: 1.2; word-break: break-all; }
  .cell .cname.long { font-size: clamp(12px, 3.4vw, 17px); }
  .cell .cteam { font-size: 12px; opacity: .85; }
  .result .actions { margin-top: 32px; display: flex; justify-content: center; }
  .result h3 { font-size: 18px; margin: 36px 0 4px; }
  .result .note { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }

  .table-scroll { overflow-x: auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
  .stat-table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-table th, .stat-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  .stat-table th { font-size: 11px; font-weight: 600; color: var(--ink-3); }
  .stat-table tr:last-child td { border-bottom: 0; }
  .stat-table .who { text-align: left; position: sticky; left: 0; background: var(--surface); }
  .stat-table td.who { border-left: 4px solid var(--team); }
  .stat-table .who b { display: inline-block; width: 1.4em; color: var(--ink-3); font-weight: 600; }
  .stat-table .who small { color: var(--ink-3); margin-left: 4px; }

  .radar-box { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
  .radar { display: block; width: 100%; max-width: 420px; margin: 0 auto; height: auto; overflow: visible; }
  .radar .ring { fill: none; stroke: var(--line); }
  .radar .spoke { stroke: var(--line); }
  .radar .avg { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .radar .mine { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
  .radar .dot { fill: var(--accent); }
  .radar .lbl { font-size: 12px; font-weight: 700; fill: var(--ink); }
  .radar .val { font-size: 12px; fill: var(--accent); font-weight: 700; }
  .radar .tick { font-size: 10px; fill: var(--ink-3); }
  .legend { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .legend i { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin-right: 6px; }
  .legend .l-mine { border-top: 3px solid var(--accent); }
  .legend .l-avg { border-top: 2px dashed var(--ink-3); }

  .recs { display: grid; gap: 8px; }
  .rec {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    border-left: 6px solid var(--team); padding: 12px 14px;
  }
  .rec .rname { font-size: 17px; font-weight: 700; }
  .rec .rmeta { font-size: 12px; color: var(--ink-2); }
  .rec .sim { grid-row: span 2; text-align: right; font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .rec .sim small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); }
</style>
</head>

<!-- 首頁 -->
<section id="home" class="wrap home">
  <p class="eyebrow">2026 CPBL</p>
  <h1>中職球員九宮格</h1>
  <p class="lead">一路「x 選 y」，從資格池的每一位球員裡挑出你的九宮格。卡片只顯示熟悉的數據，憑感覺選就好。</p>
  <div class="modes">
    <button class="mode" data-type="batters">
      <strong>打者</strong>
      <span id="desc-batters"></span>
    </button>
    <button class="mode" data-type="pitchers">
      <strong>投手</strong>
      <span id="desc-pitchers"></span>
    </button>
  </div>
  <p class="note" id="home-note"></p>
</section>

<!-- 遊戲畫面 -->
<section id="game" hidden>
  <header class="topbar">
    <div class="wrap">
      <div class="toprow">
        <div class="phase" id="phase"></div>
        <div class="navbtns">
          <button class="ghost" id="btn-back">上一步</button>
          <button class="ghost" id="btn-home">首頁</button>
        </div>
      </div>
      <div class="bar"><i id="bar-fill"></i></div>
      <div class="stages" id="stages"></div>
    </div>
  </header>

  <main id="pick" class="wrap pick">
    <div class="prompt">
      <h2 id="prompt-title"></h2>
      <span class="hint" id="prompt-hint"></span>
    </div>
    <div class="cards" id="cards"></div>
  </main>

  <main id="result" class="wrap result" hidden>
    <h2>你的中職九宮格</h2>
    <p class="sub" id="result-sub"></p>
    <div class="grid9" id="grid9"></div>

    <h3>九宮格球員數據</h3>
    <p class="note">2026 年一軍例行賽成績，依你的排名排列。</p>
    <div class="table-scroll"><table class="stat-table" id="stat-table"></table></div>

    <h3>你的偏好雷達圖</h3>
    <p class="note" id="radar-note"></p>
    <div class="radar-box">
      <svg class="radar" id="radar" viewBox="-180 -165 360 315" role="img" aria-label="偏好雷達圖"></svg>
      <div class="legend"><span><i class="l-mine"></i>你的輪廓</span><span><i class="l-avg"></i>資格池平均（PR 50）</span></div>
    </div>

    <h3>你可能也會喜歡的球員</h3>
    <p class="note">資格池中數據輪廓與你最接近、但不在九宮格裡的 3 位。</p>
    <div class="recs" id="recs"></div>

    <div class="actions">
      <button class="primary" id="btn-restart">重新開始</button>
    </div>
  </main>

  <div class="actionbar" id="actionbar">
    <div class="wrap"><button class="primary" id="btn-next" disabled>確定</button></div>
  </div>
</section>

// ===== 資料結束 =====

const TEAMS = {
  '中信兄弟':       { short: '中信兄弟', color: '#f5c400', ink: '#1c1b19' },
  '統一7-ELEVEn獅': { short: '統一獅',   color: '#f26b21', ink: '#ffffff' },
  '樂天桃猿':       { short: '樂天桃猿', color: '#8a1538', ink: '#ffffff' },
  '富邦悍將':       { short: '富邦悍將', color: '#1d4e9e', ink: '#ffffff' },
  '味全龍':         { short: '味全龍',   color: '#d7141a', ink: '#ffffff' },
  '台鋼雄鷹':       { short: '台鋼雄鷹', color: '#00594c', ink: '#ffffff' },
};
const TEAM_FALLBACK = { color: '#555555', ink: '#ffffff' };

const TYPE_LABEL = { batters: '打者', pitchers: '投手' };
const PICK = 3;            // 海選、複選每輪選幾人
const GROUPS = 3;          // 複選組數
const RANK_STEPS = 2 + 6;  // 排名：分段 2 步 + 組內排序 6 步

// ---------- 小工具 ----------
const $ = (id) => document.getElementById(id);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const displayName = (p) => p.name.replace(/^#/, '');
const team = (p) => TEAMS[p.team] || { short: p.team, ...TEAM_FALLBACK };
const fmtRate = (v) => v.toFixed(3).replace(/^0/, '');  // .294
const fmt2 = (v) => v.toFixed(2);

// 海選分輪：每輪 9 人，餘數由最後幾輪各多 1 人（投手 65 人 → 5 輪 9 人、2 輪 10 人）
function roundSizes(n) {
  const r = Math.floor(n / 9);
  const sizes = Array(r).fill(9);
  for (let i = 0; i < n - 9 * r; i++) sizes[r - 1 - (i % r)]++;
  return sizes;
}
function totalSteps(type) {
  return roundSizes(DATA[type].length).length + GROUPS + RANK_STEPS;
}

// ---------- 卡片 ----------
function cardStats(p, type) {
  const d = p.display;
  if (type === 'batters') {
    return [['打擊率', fmtRate(d.AVG)], ['全壘打', d.HR], ['OPS', fmtRate(d.OPS)]];
  }
  return [['防禦率', fmt2(d.ERA)], ['WHIP', fmt2(d.WHIP)]];
}

function cardHTML(idx, type, order) {
  const p = DATA[type][idx];
  const t = team(p);
  const name = displayName(p);
  const tag = type === 'pitchers'
    ? `<span class="tag${t.ink === '#ffffff' ? '' : ' dark'}">${esc(p.role)}</span>` : '';
  const items = cardStats(p, type);
  const stats = items.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
  return `<button class="card${order ? ' sel' : ''}" data-idx="${idx}" aria-pressed="${!!order}"
      style="--team:${t.color};--team-ink:${t.ink}">
    <div class="band"><span>${esc(t.short)}</span>${tag}</div>
    <div class="name${name.length > 4 ? ' long' : ''}">${esc(name)}</div>
    <dl class="stats" style="--cols:${items.length}">${stats}</dl>
    <span class="check">${order || ''}</span>
  </button>`;
}

// ---------- 遊戲狀態 ----------
// game 只存球員在 DATA[type] 中的索引，方便用 JSON 複製做「上一步」
let game = null;
let history = [];
let selected = [];

function newGame(type) {
  const pool = shuffle(DATA[type].map((_, i) => i));
  const rounds = [];
  let k = 0;
  for (const size of roundSizes(pool.length)) { rounds.push(pool.slice(k, k + size)); k += size; }
  game = {
    type, total: totalSteps(type), step: 1,
    stage: 'audition',
    rounds, r: 0, finalists: [],   // 海選：每輪入圍的 3 人
    groups: [], g: 0, nine: [],    // 複選
    rest: [], tiers: [],           // 排名：分段
    t: 0, left: [], ranked: [],    // 排名：組內排序
  };
  history = [];
  selected = [];
  show('game');
  render();
}

const pickTitle = (need) => need === 1 ? '選出你最喜歡的選手' : `選出你最喜歡的 ${need} 位選手`;

// 目前這一步要顯示的內容
function currentStep() {
  const g = game;
  switch (g.stage) {
    case 'audition': {
      const c = g.rounds[g.r];
      return { phase: `海選 第 ${g.r + 1} 輪`, title: pickTitle(PICK), cands: c, need: PICK };
    }
    case 'semi': {
      const c = g.groups[g.g];
      return { phase: `複選 第 ${g.g + 1} 組`, title: pickTitle(PICK), cands: c, need: PICK };
    }
    case 'tier':
      return { phase: '排名', title: pickTitle(3), cands: g.rest, need: 3 };
    case 'order':
      return { phase: '排名', title: pickTitle(1), cands: g.left, need: 1 };
  }
}

function submit(sel) {
  const g = game;
  history.push(JSON.stringify(g));
  switch (g.stage) {
    case 'audition':
      g.finalists.push(sel);
      if (++g.r === g.rounds.length) {
        // 複選分組：每輪入圍的 3 人各分到不同組，避免同輪入圍者擠在同一組
        g.groups = Array.from({ length: GROUPS }, () => []);
        for (const trio of g.finalists) shuffle(trio).forEach((idx, i) => g.groups[i % GROUPS].push(idx));
        g.groups = g.groups.map(shuffle);
        g.stage = 'semi';
      }
      break;
    case 'semi':
      g.nine.push(...sel);
      if (++g.g === GROUPS) { g.rest = shuffle(g.nine); g.stage = 'tier'; }
      break;
    case 'tier':
      g.tiers.push(sel);
      g.rest = g.rest.filter((i) => !sel.includes(i));
      if (g.tiers.length === 2) {
        g.tiers.push(g.rest);
        g.stage = 'order';
        g.left = g.tiers[0].slice();
      }
      break;
    case 'order':
      g.ranked.push(sel[0]);
      g.left = g.left.filter((i) => i !== sel[0]);
      if (g.left.length === 1) {
        g.ranked.push(g.left[0]);
        if (++g.t === g.tiers.length) g.stage = 'result';
        else g.left = g.tiers[g.t].slice();
      }
      break;
  }
  g.step++;
  selected = [];
  render();
  window.scrollTo({ top: 0 });
}

function back() {
  if (!history.length) return;
  game = JSON.parse(history.pop());
  selected = [];
  render();
}

// ---------- 畫面 ----------
function show(view) {
  $('home').hidden = view !== 'home';
  $('game').hidden = view !== 'game';
}

function renderProgress(phaseText) {
  const g = game;
  const done = g.stage === 'result';
  const stepNo = Math.min(g.step, g.total);
  $('phase').innerHTML = done
    ? `完成<span class="sep">｜</span><span class="count">${g.total} / ${g.total} 步</span>`
    : `${esc(phaseText)}<span class="sep">｜</span><span class="count">第 ${stepNo} / ${g.total} 步</span>`;
  $('bar-fill').style.width = `${((done ? g.total : g.step - 1) / g.total) * 100}%`;

  const order = ['audition', 'semi', 'rank', 'result'];
  const labels = ['海選', '複選', '排名', '結果'];
  const cur = { audition: 0, semi: 1, tier: 2, order: 2, result: 3 }[g.stage];
  $('stages').innerHTML = order.map((_, i) =>
    `<span class="${i === cur ? 'on' : i < cur ? 'done' : ''}">${labels[i]}</span>`).join('');
  $('btn-back').disabled = history.length === 0;
}

function render() {
  if (game.stage === 'result') return renderResult();
  const s = currentStep();
  renderProgress(s.phase);
  $('pick').hidden = false;
  $('result').hidden = true;
  $('actionbar').hidden = false;

  $('prompt-title').textContent = s.title;
  const cards = $('cards');
  cards.classList.toggle('few', s.cands.length <= 3);
  cards.style.setProperty('--n', s.cands.length);
  cards.innerHTML = s.cands.map((idx) => cardHTML(idx, game.type, selected.indexOf(idx) + 1)).join('');
  updateSelectionUI(s);
}

function updateSelectionUI(s) {
  $('prompt-hint').textContent = `已選 ${selected.length} / ${s.need}`;
  const btn = $('btn-next');
  btn.disabled = selected.length !== s.need;
  btn.textContent = selected.length === s.need ? '確定，下一步' : `還要選 ${s.need - selected.length} 位`;
  for (const el of $('cards').children) {
    const n = selected.indexOf(Number(el.dataset.idx)) + 1;
    el.classList.toggle('sel', n > 0);
    el.setAttribute('aria-pressed', n > 0);
    el.querySelector('.check').textContent = n || '';
  }
}

function toggle(idx) {
  const s = currentStep();
  const at = selected.indexOf(idx);
  if (at >= 0) selected.splice(at, 1);
  else if (s.need === 1) selected = [idx];          // 單選時直接替換
  else if (selected.length < s.need) selected.push(idx);
  else {                                             // 已選滿：提示先取消
    const hint = $('prompt-hint');
    hint.classList.remove('flash'); void hint.offsetWidth; hint.classList.add('flash');
    return;
  }
  updateSelectionUI(s);
}

// ---------- 結果頁：數據分析 ----------
// 雷達圖軸（PR 值越高代表數值越大，不一定越好）
const AXES = {
  batters: [
    { key: 'ISO', label: '長打力', sub: 'ISO' },
    { key: 'K%', label: '三振率', sub: 'K%' },
    { key: 'BB%', label: '保送率', sub: 'BB%' },
    { key: 'Barrel%', label: '出色擊球率', sub: 'Barrel%' },
    { key: 'LA', label: '擊球仰角', sub: '平均仰角' },
  ],
  pitchers: [
    { key: 'Velo', label: '快速球均速', sub: '球速' },
    { key: 'K%', label: '三振率', sub: 'K%' },
    { key: 'BB%', label: '保送率', sub: 'BB%' },
    { key: 'GO/AO', label: '滾飛出局比', sub: 'GO/AO' },
  ],
};

// 加權輪廓：第 r 名權重 10 − r
function profile(type, ranked) {
  const axes = AXES[type];
  const wSum = ranked.reduce((s, _, i) => s + (9 - i), 0);
  return axes.map((a) => ranked.reduce((s, idx, i) => s + (9 - i) * DATA[type][idx].pr[a.key], 0) / wSum);
}

// 相似度 = (1 − d / (100√k)) × 100%，排除九宮格後取前 3 名
function recommend(type, ranked, prof, n = 3) {
  const axes = AXES[type];
  const maxD = 100 * Math.sqrt(axes.length);
  return DATA[type]
    .map((p, idx) => {
      const d = Math.sqrt(axes.reduce((s, a, j) => s + (prof[j] - p.pr[a.key]) ** 2, 0));
      return { idx, sim: (1 - d / maxD) * 100 };
    })
    .filter((r) => !ranked.includes(r.idx))
    .sort((a, b) => b.sim - a.sim)
    .slice(0, n);
}

const fmtIP = (ip) => { const w = Math.floor(ip + 1e-6); return `${w}.${Math.round((ip - w) * 3)}`; };

function statColumns(type) {
  return type === 'batters'
    ? [['打席', (p) => p.PA], ['打擊率', (p) => fmtRate(p.display.AVG)], ['上壘率', (p) => fmtRate(p.display.OBP)],
       ['長打率', (p) => fmtRate(p.display.SLG)], ['OPS', (p) => fmtRate(p.display.OPS)], ['全壘打', (p) => p.display.HR],
       ['打點', (p) => p.display.RBI], ['盜壘', (p) => p.display.SB]]
    : [['角色', (p) => p.role], ['出賽', (p) => p.G], ['局數', (p) => fmtIP(p.IP)], ['防禦率', (p) => fmt2(p.display.ERA)],
       ['WHIP', (p) => fmt2(p.display.WHIP)], ['勝-敗', (p) => `${p.display.W}-${p.display.L}`], ['救援', (p) => p.display.SV],
       ['中繼', (p) => p.display.HLD], ['K%', (p) => p.raw['K%'].toFixed(1) + '%'], ['BB%', (p) => p.raw['BB%'].toFixed(1) + '%']];
}

function renderStatTable(type, ranked) {
  const cols = statColumns(type);
  const head = `<tr><th class="who">球員</th>${cols.map(([h]) => `<th>${h}</th>`).join('')}</tr>`;
  const rows = ranked.map((idx, i) => {
    const p = DATA[type][idx];
    const t = team(p);
    return `<tr><td class="who" style="--team:${t.color}"><b>${i + 1}</b>${esc(displayName(p))}<small>${esc(t.short)}</small></td>
      ${cols.map(([, f]) => `<td>${esc(f(p))}</td>`).join('')}</tr>`;
  }).join('');
  $('stat-table').innerHTML = `<thead>${head}</thead><tbody>${rows}</tbody>`;
}

function renderRadar(type, prof) {
  const axes = AXES[type];
  const R = 95;
  const pt = (j, v) => {
    const a = -Math.PI / 2 + (2 * Math.PI * j) / axes.length;
    return [Math.cos(a) * R * v / 100, Math.sin(a) * R * v / 100];
  };
  const poly = (vals) => vals.map((v, j) => pt(j, v).map((n) => n.toFixed(1)).join(',')).join(' ');
  let svg = '';
  for (const lv of [25, 75, 100]) svg += `<polygon class="ring" points="${poly(axes.map(() => lv))}"/>`;
  axes.forEach((_, j) => { const [x, y] = pt(j, 100); svg += `<line class="spoke" x1="0" y1="0" x2="${x}" y2="${y}"/>`; });
  svg += `<polygon class="avg" points="${poly(axes.map(() => 50))}"/>`;
  svg += `<polygon class="mine" points="${poly(prof)}"/>`;
  prof.forEach((v, j) => { const [x, y] = pt(j, v); svg += `<circle class="dot" cx="${x}" cy="${y}" r="3.5"/>`; });
  for (const lv of [50, 100]) svg += `<text class="tick" x="3" y="${-lv + 10}">${lv}</text>`;
  axes.forEach((a, j) => {
    const [x, y] = pt(j, 112);
    const anchor = Math.abs(x) < 5 ? 'middle' : x > 0 ? 'start' : 'end';
    const top = y < -5 ? y - 30 : y > 5 ? y + 10 : y - 12;  // 三行文字的第一行位置
    svg += `<text text-anchor="${anchor}" x="${x}">
      <tspan class="lbl" x="${x}" y="${top}">${a.label}</tspan>
      <tspan class="tick" x="${x}" y="${top + 13}">${a.sub}</tspan>
      <tspan class="val" x="${x}" y="${top + 28}">PR ${Math.round(prof[j])}</tspan></text>`;
  });
  $('radar').innerHTML = svg;
  $('radar-note').textContent = '九宮格球員的加權平均輪廓（第 1 名權重 9、第 9 名權重 1）。'
    + 'PR 值是在資格池內的百分等級，越高代表該項數值越大，不一定代表越好，'
    + (type === 'batters' ? '例如三振率 PR 高代表常被三振。' : '例如保送率 PR 高代表投出較多保送。');
}

function renderRecs(type, recs) {
  $('recs').innerHTML = recs.map(({ idx, sim }) => {
    const p = DATA[type][idx];
    const t = team(p);
    const meta = type === 'batters'
      ? `打擊率 ${fmtRate(p.display.AVG)}・全壘打 ${p.display.HR}・OPS ${fmtRate(p.display.OPS)}`
      : `${p.role}・防禦率 ${fmt2(p.display.ERA)}・WHIP ${fmt2(p.display.WHIP)}`;
    return `<div class="rec" style="--team:${t.color}">
      <div class="rname">${esc(displayName(p))}</div>
      <div class="sim">${sim.toFixed(1)}%<small>相似度</small></div>
      <div class="rmeta">${esc(t.short)}・${esc(meta)}</div>
    </div>`;
  }).join('');
}

function renderResult() {
  renderProgress('');
  $('pick').hidden = true;
  $('result').hidden = false;
  $('actionbar').hidden = true;
  $('result-sub').textContent = `${TYPE_LABEL[game.type]}篇・第 1 名在左上，依序排到第 9 名`;
  $('grid9').innerHTML = game.ranked.map((idx, i) => {
    const p = DATA[game.type][idx];
    const t = team(p);
    const name = displayName(p);
    return `<div class="cell" style="--team:${t.color};--team-ink:${t.ink}">
      <span class="rank${i < 3 ? ' top' : ''}">${i + 1}</span>
      <span class="cname${name.length > 4 ? ' long' : ''}">${esc(name)}</span>
      <span class="cteam">${esc(t.short)}${game.type === 'pitchers' ? '・' + esc(p.role) : ''}</span>
    </div>`;
  }).join('');

  const prof = profile(game.type, game.ranked);
  renderStatTable(game.type, game.ranked);
  renderRadar(game.type, prof);
  renderRecs(game.type, recommend(game.type, game.ranked, prof));
}

// ---------- 事件 ----------
document.querySelectorAll('.mode').forEach((b) => b.addEventListener('click', () => newGame(b.dataset.type)));
$('cards').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) toggle(Number(card.dataset.idx));
});
$('btn-next').addEventListener('click', () => {
  if (selected.length === currentStep().need) submit(selected.slice());
});
$('btn-back').addEventListener('click', back);
$('btn-home').addEventListener('click', () => {
  if (game.stage === 'result' || confirm('回到首頁會放棄目前的進度，確定嗎？')) show('home');
});
$('btn-restart').addEventListener('click', () => show('home'));

// 首頁說明文字
for (const type of ['batters', 'pitchers']) {
  $(`desc-${type}`).textContent = `資格池 ${DATA[type].length} 人・共 ${totalSteps(type)} 步`;
}
$('home-note').textContent = `資料：${DATA.meta.season} 年中職一軍例行賽，打者 ${DATA.meta.thresholds.batter_min_pa} 打席以上；投手依先發、搖擺人、後援各自門檻。`;
</script>
